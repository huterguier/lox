name: JAX Version Compatibility

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} | JAX ${{ matrix.jax-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        jax-version: ["0.7.2", "0.8.3", "0.9.2", "0.10.2", "0.11.0"]
        exclude:
          # JAX 0.11 requires Python >= 3.12
          - python-version: "3.11"
            jax-version: "0.11.0"

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[tests]"
        
    - name: Install JAX ${{ matrix.jax-version }}
      run: |
        # Explicitly install matching jax and jaxlib versions for CPU tests
        python -m pip install jax==${{ matrix.jax-version }} jaxlib==${{ matrix.jax-version }}
        
    - name: Run tests
      run: |
        # Run all tests in the tests/ directory
        pytest tests/
